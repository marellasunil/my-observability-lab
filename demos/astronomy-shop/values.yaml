components:
  load-generator:
    env:
    - name: LOCUST_WEB_HOST
      value: 0.0.0.0
    - name: LOCUST_WEB_PORT
      value: '8089'
    - name: LOCUST_USERS
      value: '1'
    - name: LOCUST_HOST
      value: http://frontend-proxy:8080
    - name: LOCUST_HEADLESS
      value: 'false'
    - name: LOCUST_AUTOSTART
      value: 'false'
    - name: LOCUST_BROWSER_TRAFFIC_ENABLED
      value: 'false'
    - name: LOCUST_HTTP_USER_WEIGHT
      value: '9'
    - name: LOCUST_BROWSER_USER_WEIGHT
      value: '1'
    - name: PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION
      value: python
    - name: OTEL_PYTHON_SDK_INTERNAL_METRICS_ENABLED
      value: 'true'
    - name: FLAGD_HOST
      value: flagd
    - name: FLAGD_PORT
      value: '8013'
    - name: FLAGD_OFREP_PORT
      value: '8016'
    - name: AGENT_ENDPOINT
      value: agent
    - name: AGENT_PORT
      value: '8010'
    - name: OTEL_EXPORTER_OTLP_ENDPOINT
      value: http://$(OTEL_COLLECTOR_NAME):4318
    - name: OTEL_RESOURCE_ATTRIBUTES_EXTRA
      value: service.criticality=low
  opamp-server:
    enabled: false
grafana:
  enabled: false
jaeger:
  enabled: false
opensearch:
  enabled: false
opentelemetry-collector:
  alternateConfig:
    connectors:
      span_metrics: {}
    exporters:
      otlp_grpc/gateway:
        endpoint: otel-gateway.observability.svc.cluster.local:14317
        retry_on_failure:
          enabled: true
        sending_queue:
          enabled: true
        tls:
          insecure: true
    extensions:
      health_check:
        endpoint: ${env:MY_POD_IP}:13133
    processors:
      batch:
        send_batch_size: 1024
        timeout: 5s
      gen_ai_normalizer:
        sources:
        - name: openllmetry
      memory_limiter:
        check_interval: 5s
        limit_percentage: 80
        spike_limit_percentage: 25
      redaction:
        allow_all_keys: true
        blocked_key_patterns:
        - demo\.payment\.card_pin
        - password
        - secret
        ignored_keys:
        - demo.payment.card_number
        summary: info
      resource:
        attributes:
        - action: insert
          from_attribute: k8s.pod.uid
          key: service.instance.id
      resource_detection:
        detectors:
        - env
        - system
      transform/redact_sensitive_data:
        error_mode: ignore
        trace_statements:
        - context: span
          statements:
          - delete_key(attributes, "demo.payment.card_cvv") where attributes["demo.payment.card_cvv"]
            != nil
          - set(attributes["user.hash"], SHA256(attributes["user.email"])) where attributes["user.email"]
            != nil
          - delete_key(attributes, "user.email") where attributes["user.email"] !=
            nil
          - replace_pattern(attributes["demo.payment.card_number"], "^\\d{4}-\\d{4}-\\d{4}-",
            "****-****-****-") where attributes["demo.payment.card_number"] != nil
      transform/sanitize_logs:
        error_mode: ignore
        log_statements:
        - context: scope
          statements:
          - set(attributes["otelcol_signal"], attributes["otelcol.signal"]) where
            attributes["otelcol.signal"] != nil and not IsMap(attributes["otelcol.signal"])
          - delete_key(attributes, "otelcol.signal") where attributes["otelcol_signal"]
            != nil
      transform/sanitize_spans:
        error_mode: ignore
        trace_statements:
        - context: span
          statements:
          - set_semconv_span_name("1.43.0", "original_span_name")
    receivers:
      kafkametrics:
        brokers:
        - kafka:9092
        collection_interval: 10s
        scrapers:
        - brokers
        - topics
        - consumers
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            cors:
              allowed_headers:
              - content-type
              - traceparent
              - baggage
              allowed_origins:
              - http://*
              - https://*
            endpoint: 0.0.0.0:4318
      prometheus/ad:
        config:
          scrape_configs:
          - job_name: ad
            scrape_interval: 10s
            static_configs:
            - targets:
              - ad:9465
    service:
      extensions:
      - health_check
      pipelines:
        logs:
          exporters:
          - otlp_grpc/gateway
          processors:
          - memory_limiter
          - resource_detection
          - resource
          - transform/sanitize_logs
          - batch
          receivers:
          - otlp
        metrics:
          exporters:
          - otlp_grpc/gateway
          processors:
          - memory_limiter
          - resource_detection
          - resource
          - batch
          receivers:
          - otlp
          - kafkametrics
          - span_metrics
          - prometheus/ad
        traces:
          exporters:
          - otlp_grpc/gateway
          - span_metrics
          processors:
          - memory_limiter
          - resource_detection
          - resource
          - transform/sanitize_spans
          - gen_ai_normalizer
          - transform/redact_sensitive_data
          - redaction
          - batch
          receivers:
          - otlp
      telemetry:
        logs:
          level: info
        metrics:
          level: normal
  command:
    extraArgs: []
  enabled: true
  mode: deployment
  presets:
    annotationDiscovery:
      metrics:
        enabled: false
    clusterMetrics:
      enabled: false
    hostMetrics:
      enabled: false
    kubeletMetrics:
      enabled: false
    kubernetesAttributes:
      enabled: true
  replicaCount: 1
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
otel-ebpf-profiler:
  enabled: false
prometheus:
  enabled: false
