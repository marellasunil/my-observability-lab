receivers:
  hostmetrics:
    collection_interval: 30s
    root_path: /hostfs
    scrapers:
      cpu:
        metrics:
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.utilization:
            enabled: true
      load: {}
      filesystem: {}
      disk: {}
      network: {}
  filelog/loki_test:
    include:
    - /var/log/pods/observability_loki-log-test_*/*/*.log
    start_at: end
    include_file_path: true
    poll_interval: 5s
    operators:
    - type: regex_parser
      id: extract_k8s_metadata
      parse_from: attributes["log.file.path"]
      regex: ^/var/log/pods/(?P<namespace>[^_]+)_(?P<pod>[^_]+)_(?P<uid>[^/]+)/(?P<container>[^/]+)/(?P<restart>\d+)\.log$
    - type: move
      from: attributes.namespace
      to: resource["k8s.namespace.name"]
    - type: move
      from: attributes.pod
      to: resource["k8s.pod.name"]
    - type: move
      from: attributes.container
      to: resource["k8s.container.name"]
    - type: remove
      field: attributes.uid
    - type: remove
      field: attributes.restart
    - type: regex_parser
      id: parse_cri_log
      regex: ^(?P<time>\S+) (?P<stream>stdout|stderr) (?P<logtag>\S+) (?P<message>.*)$
      timestamp:
        parse_from: attributes.time
        layout_type: gotime
        layout: 2006-01-02T15:04:05.999999999Z07:00
      on_error: send
    - type: move
      from: attributes.message
      to: body
    - type: move
      from: attributes.stream
      to: attributes["log.iostream"]
    - type: remove
      field: attributes.time
    - type: remove
      field: attributes.logtag
processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 192
    spike_limit_mib: 48
  resource:
    attributes:
    - key: host.name
      value: ${env:NODE_NAME}
      action: upsert
    - key: deployment.environment.name
      value: homelab
      action: upsert
  batch:
    timeout: 5s
    send_batch_size: 512
exporters:
  otlp/gateway:
    endpoint: otel-gateway.observability.svc.cluster.local:4317
    tls:
      insecure: true
    sending_queue:
      enabled: true
service:
  telemetry:
    metrics:
      level: detailed
      readers:
      - pull:
          exporter:
            prometheus:
              host: 0.0.0.0
              port: 8888
  pipelines:
    metrics:
      receivers:
      - hostmetrics
      processors:
      - memory_limiter
      - resource
      - batch
      exporters:
      - otlp/gateway
    logs:
      receivers:
      - filelog/loki_test
      processors:
      - memory_limiter
      - batch
      exporters:
      - otlp/gateway
