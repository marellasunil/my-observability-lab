apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

resources:
  - daemonset.yaml
  - service.yaml
  - servicemonitor.yaml

configMapGenerator:
  - name: otel-hostmetrics-agent-config
    files:
      - config.yaml

generatorOptions:
  disableNameSuffixHash: true
