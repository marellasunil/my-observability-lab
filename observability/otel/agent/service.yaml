apiVersion: v1
kind: Service
metadata:
  name: otel-hostmetrics-agent
  namespace: observability
  labels:
    app: otel-hostmetrics-agent
spec:
  clusterIP: None
  selector:
    app: otel-hostmetrics-agent
  ports:
    - name: self-metrics
      port: 8888
      targetPort: self-metrics
      protocol: TCP
