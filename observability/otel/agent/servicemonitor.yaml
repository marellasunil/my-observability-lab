apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-hostmetrics-agent
  namespace: observability
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app: otel-hostmetrics-agent
  namespaceSelector:
    matchNames:
      - observability
  endpoints:
    - port: self-metrics
      path: /metrics
      interval: 30s
